<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- INTERNAL CSS -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #000;
      border-bottom: 1px solid #222;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    main {
      padding: 20px;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    video,
    img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #000;
    }

    video {
      outline: none;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 14px;
      color: #888;
      border-top: 1px solid #222;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Media Gallery</h1>
  </header>

  <main>
    <div class="media-grid">

      <!-- VIDEOS -->
      <video controls src="media/video1.mp4"></video>
      <video controls src="media/video2.mp4"></video>
      <video controls src="media/video3.mp4"></video>

      <!-- IMAGES (optional) -->
      <img src="media/image1.jpg" alt="Media Image">
      <img src="media/image2.jpg" alt="Media Image">

    </div>
  </main>

  <footer>
    © 2026 Media Gallery
  </footer>

</body>
</html>
